http:
  routers:
    # 0. Qwen LLM Direct Reverse Proxy
    qwen-llm-router:
      rule: "PathPrefix(`/llm`)"
      service: qwen-llm-service
      entryPoints:
        - web
        - websecure
      tls: {}
      priority: 120
      middlewares:
        - strip-llm-prefix

    # 1. Microservice Routing for Legacy LLM and Processing Services (priority 45 < bot-svc 50)
    legacy-llm-router:
      rule: "PathPrefix(`/api/ask`) || PathPrefix(`/api/generate-pdf/`) || PathPrefix(`/api/admin`) || PathPrefix(`/api/quiz`) || PathPrefix(`/api/contexts`) || PathPrefix(`/api/voice`) || PathPrefix(`/api/get-user-files`) || PathPrefix(`/api/upload-photo`) || PathPrefix(`/api/upload-audio`) || PathPrefix(`/api/delete-audio`) || PathPrefix(`/api/generate-quiz`) || PathPrefix(`/api/upload`) || PathPrefix(`/api`)"
      service: legacy-llm-service
      entryPoints:
        - web
        - websecure
      tls: {}
      priority: 45

    # 2. Production Frontend Route
    frontend-router:
      rule: "PathPrefix(`/`)"
      service: frontend-service
      entryPoints:
        - web
        - websecure
      tls: {}
      priority: 10

  middlewares:
    strip-llm-prefix:
      stripPrefix:
        prefixes:
          - "/llm"

  services:
    qwen-llm-service:
      loadBalancer:
        servers:
          - url: "http://94.184.177.171:8000"
        passHostHeader: false

    legacy-llm-service:
      loadBalancer:
        servers:
          - url: "http://172.20.13.39:8506"
        passHostHeader: false

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://digital-twin-prod:80"
        passHostHeader: true

tls:
  certificates:
    - certFile: /etc/traefik/certs/cert.pem
      keyFile: /etc/traefik/certs/key.pem
